<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f766e" />
		<title>Roll Book</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				box-sizing: border-box;
				font-family: system-ui, -apple-system, sans-serif;
				background: #ffffff;
				color: #171717;
			}
			main {
				max-width: 420px;
				text-align: center;
			}
			h1 {
				font-size: 26px;
				margin: 0 0 12px;
			}
			p {
				font-size: 18px;
				line-height: 1.5;
				margin: 0 0 24px;
			}
			button {
				font: inherit;
				font-size: 18px;
				font-weight: 700;
				min-height: 52px;
				padding: 14px 28px;
				border: 0;
				border-radius: 10px;
				background: #0f766e;
				color: #ffffff;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>No internet connection</h1>
			<p>
				Roll Book needs the internet to show and save attendance and payments.
				Connect to Wi-Fi or mobile data, then tap Try again.
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
